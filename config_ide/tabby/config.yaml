highlightPlugin:
  highlightProfiles:
    - id: 60606be0-c0ff-42bc-bf77-de8a2435447f
      name: Default
      keywords:
        - text: UVM_FATAL
          enabled: true
          background: false
          backgroundColor: '0'
          foregroundColor: '13'
          foreground: true
          isCaseSensitive: true
        - text: UVM_WARNING
          enabled: true
          background: false
          backgroundColor: '0'
          foregroundColor: '3'
          foreground: true
          isCaseSensitive: true
        - text: UVM_ERROR
          enabled: true
          background: false
          backgroundColor: '0'
          foregroundColor: '1'
          foreground: true
          isCaseSensitive: true
        - text: UVM_INFO
          enabled: true
          background: false
          backgroundColor: '0'
          foregroundColor: '4'
          foreground: true
          isCaseSensitive: true
  replaceProfiles:
    - id: 986666dd-dac9-4c7a-a295-9b4aff66abdd
      name: Default
      patterns:
        - enabled: true
          search: ERROR
          replace: 出错啦
        - enabled: true
          search: WARN
          replace: 警告警告
  highlightEnabled: true
  advanced: {}
