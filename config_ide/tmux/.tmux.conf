# ==============================================================================
# File: ~/.tmux.conf
# Description: Tmux configuration with Zellij Powerline tab style and Vim bindings
# ==============================================================================

# 1. General & Performance Settings
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 15000
set -s escape-time 0
set -g repeat-time 300
set -g set-titles on
set -g set-titles-string "#h (#S) - #W"

# 2. Mouse Selection & Copy Mode (Prevent auto-scroll down to bottom upon selection)
set-window-option -g mode-keys vi
set -g mode-style "bg=#1e3a5f,fg=#ffffff,bold"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-selection

# Exit copy-mode via Escape, q, or i
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi i send-keys -X cancel

# Single mouse click in copy-mode: Clear selection without exiting or jumping to bottom
bind-key -T copy-mode-vi MouseUp1Pane send-keys -X clear-selection
bind-key -T copy-mode MouseUp1Pane send-keys -X clear-selection

# Disable automatic copy on mouse drag release (select/highlight only; press 'y' to copy)
unbind-key -T copy-mode-vi MouseDragEnd1Pane
unbind-key -T copy-mode MouseDragEnd1Pane

# Double click & Triple click selection (highlight only without auto-copying)
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode ; send -X select-word"
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode ; send -X select-line"

# 3. Window Naming & Behavior
set -g allow-rename off
set -g automatic-rename off

# 4. Vim-like Pane Splitting (<Ctrl-b> v and <Ctrl-b> s)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# 5. Window (Tab) Management Keybindings (<Ctrl-b> c, <Ctrl-b> r, <Ctrl-b> m, <Ctrl-b> x)
bind-key c new-window -c "#{pane_current_path}" \; command-prompt -p "Tab name:" "rename-window -- '#{?#{==:%1,},#W,%1}'"
bind-key r command-prompt -I "#W" "rename-window -- '%%'"
bind-key , command-prompt -I "#W" "rename-window -- '%%'"
bind-key x confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key & confirm-before -p "kill-window #W? (y/n)" kill-window

# Interactive Tab Move Mode (<Ctrl-b> m -> Left/Right or h/l, Enter/Esc to finish)
bind-key m switch-client -T move-tab
bind-key -T move-tab Left swap-window -d -t -1 \; switch-client -T move-tab
bind-key -T move-tab Right swap-window -d -t +1 \; switch-client -T move-tab
bind-key -T move-tab h swap-window -d -t -1 \; switch-client -T move-tab
bind-key -T move-tab l swap-window -d -t +1 \; switch-client -T move-tab
bind-key -T move-tab Enter send-keys ""
bind-key -T move-tab Escape send-keys ""
bind-key -T move-tab q send-keys ""

# 6. Status Line Configuration (Zellij Powerline Theme - Soft Charcoal #1c1c1c)
set -g status 2
set -g status-position top
set -g status-interval 60
set -g status-style "bg=#1c1c1c,fg=#ffffff"
set -g window-status-separator ""

# Line 1: Accent divider line directly below top status bar (matching selection tab #af875f)
set -g "status-format[1]" "#[fg=#af875f,bg=#1c1c1c]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"

# Inactive Tab (Medium Gray #8a8a8a with Charcoal Chevron Arrow)
set -g window-status-format "#[fg=#1c1c1c,bg=#8a8a8a]#[fg=#000000,bg=#8a8a8a] #{?#{m/r:^(bash|sh|zsh)$,#{window_name}},Tab ##I,#{window_name}} #[fg=#8a8a8a,bg=#1c1c1c]"

# Active Selection Tab (Vim Khaki Theme #af875f with Charcoal Chevron Arrow)
set -g window-status-current-format "#[fg=#1c1c1c,bg=#af875f]#[fg=#232323,bg=#af875f,bold] #{?#{m/r:^(bash|sh|zsh)$,#{window_name}},Tab ##I,#{window_name}} #[fg=#af875f,bg=#1c1c1c]"

# Left status: Session name (or MOVE TAB / TMUX prefix badge)
set -g status-left-length 50
set -g status-left "#{?#{==:#{client_key_table},move-tab},#[fg=#232323]#[bg=#fab387]#[bold] MOVE TAB #[default],#{?client_prefix,#[fg=#232323]#[bg=#af875f]#[bold] TMUX #[default],#[fg=#a8a8a8]#[bg=#1c1c1c] #h (#S) #[default]}}"

# Right status: Move-tab hints, Prefix hints, or Minimal Clock (Neutral Gray #a8a8a8)
set -g status-right-length 180
set -g status-right "#{?#{==:#{client_key_table},move-tab},#[fg=#fab387]#[bold]◄ Left/h#[fg=#a8a8a8] Move Left #[fg=#6c7086]│ #[fg=#fab387]#[bold]Right/l ►#[fg=#a8a8a8] Move Right #[fg=#6c7086]│ #[fg=#f38ba8]#[bold]Enter/Esc#[fg=#a8a8a8] Done ,#{?client_prefix,#[fg=#fab387]#[bold][c]#[fg=#a8a8a8]NewTab #[fg=#6c7086]│ #[fg=#fab387]#[bold][n]#[fg=#a8a8a8]NextTab #[fg=#6c7086]│ #[fg=#fab387]#[bold][m]#[fg=#a8a8a8]Move #[fg=#6c7086]│ #[fg=#fab387]#[bold][r]#[fg=#a8a8a8]ReNameTab #[fg=#6c7086]│ #[fg=#89dceb]#[bold][v]#[fg=#a8a8a8]Split-V #[fg=#6c7086]│ #[fg=#89dceb]#[bold][s]#[fg=#a8a8a8]Split-H #[fg=#f38ba8]#[bold][x]#[fg=#a8a8a8]CloseTab #[fg=#6c7086]│ #[fg=#f38ba8]#[bold][d]#[fg=#a8a8a8]Detach ,#[fg=#a8a8a8]%H:%M #[fg=#6c7086]│ #[fg=#a8a8a8]%d-%b }}"

# 7. Pane Borders (Borders only used when splitting panes)
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour244
