# ==============================================================================
# File: ~/.tmux18.conf or ~/.tmux.conf (for Tmux 1.8)
# Description: Tmux 1.8 compatible configuration (for enterprise/RHEL/CentOS servers)
# ==============================================================================

# 1. General & Performance Settings
set -g default-terminal "screen-256color"
set -g history-limit 15000
set -s escape-time 0
set -g repeat-time 300
set -g utf8 on
set -g status-utf8 on
set-window-option -g utf8 on
set-environment -g TMUX_NO_TRUECOLOR 1
set -g set-titles on
set -g set-titles-string "#h (#S) - #W"

# 2. Mouse Support (Tmux 1.8 syntax)
# Turn off mode-mouse to prevent hardcoded auto-scroll to bottom on mouse release/click.
# Allows native terminal text selection (no scrolling down, direct copy to OS clipboard).
# Pane focus, pane resize, and window switching with mouse remain enabled.
set -g mode-mouse off
set -g mouse-resize-pane on
set -g mouse-select-pane on
set -g mouse-select-window on

# 3. Window Naming & Behavior
set -g allow-rename off
set -g automatic-rename off
set-window-option -g automatic-rename off

# 4. Vim-like Copy Mode & Navigation
set-window-option -g mode-keys vi
set-window-option -g mode-bg colour24
set-window-option -g mode-fg white
bind-key -t vi-copy 'v' begin-selection
bind-key -t vi-copy 'y' copy-selection
bind-key -t vi-copy Enter copy-selection
bind-key -t vi-copy 'J' halfpage-down
bind-key -t vi-copy 'K' halfpage-up
bind-key -t vi-copy Escape cancel
bind-key -t vi-copy 'q' cancel
bind-key -t vi-copy 'i' cancel

# 5. Vim-like Pane Navigation (<Ctrl-b> h, j, k, l) & Splits (<Ctrl-b> v, s)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key Tab select-pane -t :.+
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# 6. Window (Tab) Management Keybindings (<Ctrl-b> c, r, m, <, >, x)
bind-key c new-window -c "#{pane_current_path}" \; command-prompt -p "Tab name:" "rename-window -- '%%'"
bind-key r command-prompt -I "#W" "rename-window -- '%%'"
bind-key , command-prompt -I "#W" "rename-window -- '%%'"
bind-key m command-prompt -p "Move tab to index:" "swap-window -t '%%'"
bind-key -r < swap-window -t -1
bind-key -r > swap-window -t +1
bind-key x confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key & confirm-before -p "kill-window #W? (y/n)" kill-window

# 7. Status Line Configuration (Zellij Powerline Theme - 256 Colors)
set -g status on
set -g status-position top
set -g status-interval 60
set -g status-bg colour234
set -g status-fg white
set -g window-status-separator ""

# Inactive Tab (Medium Gray colour245 with Charcoal Chevron Arrow)
set-window-option -g window-status-bg colour245
set-window-option -g window-status-fg black
set -g window-status-format "#[fg=colour234]#[bg=colour245]#[fg=black]#[bg=colour245] #I:#W #[fg=colour245]#[bg=colour234]"

# Active Selection Tab (Vim Khaki Theme colour137 with Charcoal Chevron Arrow)
set-window-option -g window-status-current-bg colour137
set-window-option -g window-status-current-fg colour235
set -g window-status-current-format "#[fg=colour234]#[bg=colour137]#[fg=colour235]#[bg=colour137]#[bold] #I:#W #[fg=colour137]#[bg=colour234]"

# Left status: Session name (or TMUX prefix badge with action guide)
set -g status-left-length 120
set -g status-left "#{?client_prefix,#[fg=colour235]#[bg=colour137]#[bold] TMUX #[default] #[fg=colour215]#[bold][c]#[fg=colour248]NewTab #[fg=colour242]│ #[fg=colour215]#[bold][n]#[fg=colour248]NextTab #[fg=colour242]│ #[fg=colour215]#[bold][m]#[fg=colour248]Move #[fg=colour242]│ #[fg=colour215]#[bold][r]#[fg=colour248]ReNameTab #[fg=colour242]│ #[fg=colour117]#[bold][v]#[fg=colour248]Split-V #[fg=colour242]│ #[fg=colour117]#[bold][s]#[fg=colour248]Split-H #[fg=colour211]#[bold][x]#[fg=colour248]CloseTab #[fg=colour242]│ #[fg=colour211]#[bold][d]#[fg=colour248]Detach ,#[fg=colour248]#[bg=colour234] #h (#S) #[default]}"

# Right status: Minimal Clock & Date (Neutral Gray colour248)
set -g status-right-length 40
set -g status-right "#[fg=colour248]%H:%M #[fg=colour242]│ #[fg=colour248]%d-%b "

# 8. Pane Borders (Tmux 1.8 syntax)
set -g pane-border-fg colour238
set -g pane-active-border-fg colour137
